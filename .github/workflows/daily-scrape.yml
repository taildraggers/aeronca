# Scrapes Controller.com and Barnstormers.com for Aeronca listings once a day.
name: Daily Aeronca Listings Scrape

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug raw responses
        run: |
          echo "--- Barnstormers category page ---"
          curl -sL -D - -o /tmp/barn.html \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            "https://www.barnstormers.com/category-16404-Antique-Classic--Aeronca.html" | head -30
          echo "content length: $(wc -c < /tmp/barn.html)"
          echo "first 1000 chars:"
          head -c 1000 /tmp/barn.html
          echo
          echo "--- Controller.com listing page ---"
          curl -sL -D - -o /tmp/ctrl.html \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            "https://www.controller.com/listings/for-sale/aeronca/aircraft" | head -30
          echo "content length: $(wc -c < /tmp/ctrl.html)"
          echo "first 1000 chars:"
          head -c 1000 /tmp/ctrl.html

      - name: Run scraper
        run: python main.py

      - name: Commit and push updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Aeronca listings ($(date -u +'%Y-%m-%d'))"
            git push
          fi
